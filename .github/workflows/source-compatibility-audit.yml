name: Source compatibility maintenance

on:
  push:
    branches: [fix/game-release]
    paths: [.github/workflows/source-compatibility-audit.yml]

permissions:
  contents: write

jobs:
  source-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact source edits without building or testing the mod
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import zipfile

          root = pathlib.Path('.')
          output = root / '_source_audit'
          output.mkdir(exist_ok=True)
          source_paths = [p for p in subprocess.check_output(['git', 'ls-files'], text=True).splitlines() if p.endswith(('.cs', '.csproj', '.config', '.md')) or p == '.editorconfig']
          with zipfile.ZipFile(output / 'source-before.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in source_paths:
                  archive.write(root / name, name)

          def replace_once(text, old, new):
              if text.count(old) != 1:
                  raise RuntimeError('The expected source fragment was not unique; refusing to edit.')
              return text.replace(old, new, 1)

          path = root / 'SeasonState/SeasonState.cs'
          text = path.read_text(encoding='utf-8-sig')
          text = replace_once(text, 'Player.m_localPlayer.m_visEquipment.m_rightItem == prefabName', 'Player.m_localPlayer.m_visEquipment.m_rightItem == prefabName.GetStableHashCode()')
          text = replace_once(text, 'Player.m_localPlayer.m_visEquipment.m_leftItem == prefabName', 'Player.m_localPlayer.m_visEquipment.m_leftItem == prefabName.GetStableHashCode()')
          text = replace_once(text, 'if (IsActive && UseTextureControllers())\n                CameraEffects.instance.SetBloom((!disableBloomInWinter.Value || GetCurrentSeason() != Season.Winter) && PlatformPrefs.GetInt("Bloom", 1) == 1);', 'if (IsActive && UseTextureControllers() && CameraEffects.instance != null && GraphicsSettingsManager.Instance != null)\n                CameraEffects.instance.SetBloom(GraphicsSettingsManager.Instance.ActiveSettings.m_bloom);')
          path.write_text(text, encoding='utf-8')

          path = root / 'SeasonState/SeasonStatePatches.cs'
          text = path.read_text(encoding='utf-8-sig')
          text = replace_once(text, '[HarmonyPatch(typeof(Settings), nameof(Settings.ApplyAndClose))]\n        public static class Settings_ApplyAndClose_ForceUpdateState\n        {\n            private static void Postfix()\n            {\n                seasonState?.UpdateWinterBloomEffect();\n            }\n        }', '[HarmonyPatch(typeof(CameraEffects), nameof(CameraEffects.SetBloom))]\n        public static class CameraEffects_SetBloom_WinterOverride\n        {\n            private static void Prefix(ref bool enabled)\n            {\n                if (SeasonState.IsActive && disableBloomInWinter.Value && seasonState.GetCurrentSeason() == Season.Winter)\n                    enabled = false;\n            }\n        }')
          path.write_text(text, encoding='utf-8-sig')

          subprocess.run(['git', 'diff', '--check'], check=True)
          diff = subprocess.check_output(['git', 'diff'], text=True)
          for line in diff.splitlines():
              if line.startswith('+') and not line.startswith('+++') and re.search('[\u0400-\u04ff]', line):
                  raise RuntimeError('Unexpected Cyrillic text in a source addition.')
          (output / 'source-changes.diff').write_text(diff, encoding='utf-8')
          print(diff)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SeasonState/SeasonState.cs SeasonState/SeasonStatePatches.cs
          git commit -m 'Fix hashed equipment names and graphics settings integration for Valheim 1.0.7'
          git push origin HEAD:fix/game-release
          python3 - <<'PY'
          import pathlib
          import subprocess
          import zipfile
          root = pathlib.Path('.')
          source_paths = [p for p in subprocess.check_output(['git', 'ls-files'], text=True).splitlines() if p.endswith(('.cs', '.csproj', '.config', '.md')) or p == '.editorconfig']
          with zipfile.ZipFile('_source_audit/source-after.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in source_paths:
                  archive.write(root / name, name)
          pathlib.Path('_source_audit/head.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-review-snapshot
          path: _source_audit/
          retention-days: 3
