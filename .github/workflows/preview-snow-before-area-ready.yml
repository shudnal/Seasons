name: Preview snow before area readiness

on:
  push:
    branches:
      - fix/game-release
    paths:
      - .github/workflows/preview-snow-before-area-ready.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/game-release
          fetch-depth: 0

      - name: Add pending local snow preview
        run: python .github/scripts/preview_snow_before_area_ready.py

      - name: Validate changes
        run: |
          git diff --check
          test -z "$(git grep -nP '[\x{0400}-\x{04FF}]' -- '*.cs' ':!Localization/**' || true)"
          git grep -n "UpdatePendingLocalSnowVisual" -- SeasonState/SeasonalSnow.cs
          git grep -n "localVisualApplied" -- SeasonState/SeasonalSnow.cs
          git grep -n "GetPassiveSeasonalSnowTarget(instance)" -- SeasonState/SeasonalSnow.cs
          git grep -n "CanInitializeSnowState(instance, zdo)" -- SeasonState/SeasonalSnow.cs

      - name: Commit changes
        run: |
          rm -f .github/scripts/preview_snow_before_area_ready.py
          rm -f .github/workflows/preview-snow-before-area-ready.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preview seasonal snow before area readiness"
          git push origin HEAD:fix/game-release
