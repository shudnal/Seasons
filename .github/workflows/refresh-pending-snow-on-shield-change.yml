name: Refresh pending snow on shield change

on:
  push:
    branches:
      - fix/game-release
    paths:
      - .github/workflows/refresh-pending-snow-on-shield-change.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/game-release
          fetch-depth: 0

      - name: Refresh local snow preview on shield changes
        shell: python
        run: |
          from pathlib import Path

          path = Path("SeasonState/SeasonalSnow.cs")
          text = path.read_text(encoding="utf-8-sig")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one {label}, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              """            public bool localVisualApplied;
            public float localVisualSnow;
            public long observedOwner = long.MinValue;""",
              """            public bool localVisualApplied;
            public float localVisualSnow;
            public int localVisualShieldChangeID = int.MinValue;
            public long observedOwner = long.MinValue;""",
              "local preview shield revision field")

          replace_once(
              """            state.localVisualApplied = false;
            state.localVisualSnow = 0f;
            return true;""",
              """            state.localVisualApplied = false;
            state.localVisualSnow = 0f;
            state.localVisualShieldChangeID = int.MinValue;
            return true;""",
              "local preview reset")

          replace_once(
              """            ApplyLocalSnowVisual(
                instance,
                state,
                GetPassiveSeasonalSnowTarget(instance));""",
              """            int shieldChangeID = ShieldGenerator.m_instanceChangeID;
            if (state.localVisualApplied &&
                state.localVisualShieldChangeID == shieldChangeID)
                return;

            state.localVisualShieldChangeID = shieldChangeID;
            bool shielded = ShieldGenerator.IsInsideShieldCached(
                instance.transform.position,
                ref instance.m_shieldChangeID);

            ApplyLocalSnowVisual(
                instance,
                state,
                shielded ? 0f : GetPassiveSeasonalSnowTarget(instance));""",
              "pending local snow preview application")

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/refresh-pending-snow-on-shield-change.yml").unlink()

      - name: Validate changes
        run: |
          git diff --check
          test -z "$(git grep -nP '[\x{0400}-\x{04FF}]' -- '*.cs' ':!Localization/**' || true)"
          test ! -e .github/workflows/refresh-pending-snow-on-shield-change.yml
          git grep -n "localVisualShieldChangeID" -- SeasonState/SeasonalSnow.cs
          git grep -n "ShieldGenerator.m_instanceChangeID" -- SeasonState/SeasonalSnow.cs
          git grep -n "ShieldGenerator.IsInsideShieldCached" -- SeasonState/SeasonalSnow.cs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh pending snow previews on shield changes"
          git push origin HEAD:fix/game-release
